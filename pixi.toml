[workspace]
channels = ["conda-forge"]
name = "delivery_api"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
ubereats = { cmd = "python src/ubereats/client.py", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }
wolt = { cmd = "python src/wolt/client.py", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }
hofgarten = "python src/hofgarten/client.py"
kirchenpavillon = "python src/kirchenpavillon/client.py"
scrape = { cmd = "python src/main.py", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }
setup-location = "python src/setup_location.py"
lunch-feed = { cmd = "python src/lunch_feed.py", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }
lunch-feed-compact = { cmd = "python src/lunch_feed.py --compact", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }
lunch-feed-cache-compact = { cmd = "python src/lunch_feed.py --cache-only --compact", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }
openclaw = { cmd = "python src/openclaw.py", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }
openclaw-compact = { cmd = "python src/openclaw.py --compact", env = { LD_LIBRARY_PATH = ".pixi/envs/default/lib" } }

[dependencies]
python = ">=3.14.3,<3.15"
alsa-lib = ">=1.2.15.3,<2"
nss = ">=3.118,<4"
xorg-libx11 = ">=1.8.13,<2"
libxcb = ">=1.17.0,<2"
jupyter = ">=1.1.1,<2"
nbconvert = ">=7.17.0,<8"

[pypi-dependencies]
camoufox = ">=0.4.11, <0.5"
playwright = ">=1.58.0, <2"
httpx = ">=0.28.1, <0.29"
pandas = ">=3.0.1, <4"
pyarrow = ">=23.0.1, <24"
pytest = ">=9.0.2, <10"
thefuzz = ">=0.22"
pymupdf = ">=1.25"
tabulate = ">=0.9"
